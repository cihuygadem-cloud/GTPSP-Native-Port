plugins {
    id 'com.android.application'
}

android {
    namespace 'id.rezzz.gtpspnativekit'
    compileSdk 35

    defaultConfig {
        applicationId 'id.rezzz.gtpspnativekit'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '0.1.0'
        externalNativeBuild {
            cmake { cppFlags '-std=c++17' }
        }
        ndk { abiFilters 'arm64-v8a', 'armeabi-v7a' }
    }

    externalNativeBuild {
        cmake { path 'src/main/cpp/CMakeLists.txt' }
    }
}
